# The deployed system: PostgreSQL, the API, the projector, and TLS in front.
#
# Everything except Caddy is bound to the internal network only. The database
# is never published to a port on the host, because a financial store that
# listens on the internet is one firewall mistake away from being read.
name: mfa

# A container gets what it needs and nothing else, so a compromised process
# stays inside it. The memory limits add up to less than the 4 GB host: one
# runaway service is restarted rather than taking the database down with it.
x-confined: &confined
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

# The API image reads its code and writes nothing but temporary files.
x-api-process: &api-process
  <<: *confined
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  postgres:
    <<: *confined
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    mem_limit: 1536m
    # What the entrypoint needs to hand the data directory to its own user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Deterministic collation, so an index built here sorts the way the
      # application expects wherever it is restored.
      LANG: C.UTF-8
    volumes:
      - ${MFA_DATA_ROOT:?}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # A one-shot that must finish before the API serves anything: the schema is
  # part of the deployment, not something the first request discovers missing.
  migrate:
    <<: *api-process
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: mfa-api:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MFA_DATABASE_URL: ${MFA_DATABASE_URL:?}
    # The migration environment reads MFA_DATABASE_URL itself and refuses
    # anything that is not asyncpg, so there is nothing to pass on the command
    # line and no second place a URL could disagree.
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]

  api:
    <<: *api-process
    image: mfa-api:local
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The unprivileged login once app-role.sh has created it; the migrating
      # one until then, so a deploy never depends on that step having run.
      MFA_DATABASE_URL: ${MFA_APP_DATABASE_URL:-${MFA_DATABASE_URL:?}}
      MFA_AUTH_JWT_SECRET: ${MFA_AUTH_JWT_SECRET:?}
      MFA_AUTH_REGISTRATION_ALLOWLIST: ${MFA_AUTH_REGISTRATION_ALLOWLIST-}
      MFA_RELEASE_DIR: /srv/releases
      MFA_APP_DOWNLOAD_LINK_SECRET: ${MFA_APP_DOWNLOAD_LINK_SECRET-}
      # Whom uvicorn believes about a client's address. Only Caddy can reach
      # this port, and Caddy overwrites whatever the client claimed.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      # Read-only: the API distributes a build, it never publishes one. The
      # file arrives from where the signing key is (ADR 0026).
      - ${MFA_DATA_ROOT:?}/releases:/srv/releases:ro
    expose:
      - "8000"

  # Its own process by design (ADR 0012): a projector that shares the API's
  # lifetime cannot be restarted, scaled, or paused without taking reads down.
  projector:
    <<: *api-process
    image: mfa-api:local
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MFA_DATABASE_URL: ${MFA_APP_DATABASE_URL:-${MFA_DATABASE_URL:?}}
    command: ["python", "-m", "mobile_finance_api.projector_runtime"]
    # Reports; it restarts nothing. `docker compose ps` shows the answer.
    healthcheck:
      test: ["CMD", "python", "-m", "mobile_finance_api.projector_runtime", "--check-health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  caddy:
    <<: *confined
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    mem_limit: 256m
    # DAC_OVERRIDE: the certificate directories already exist on the host and
    # this must not depend on who created them.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      MFA_DOMAIN: ${MFA_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MFA_DATA_ROOT:?}/caddy/data:/data
      - ${MFA_DATA_ROOT:?}/caddy/config:/config
