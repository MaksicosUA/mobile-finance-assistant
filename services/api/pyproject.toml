[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-finance-assistant-api"
version = "0.1.0"
description = "Read-only versioned API for the Mobile Finance Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.0",
  "pydantic==2.13.4",
  "tzdata==2026.3",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobile_finance_api = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"src/mobile_finance_api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mobile_finance_api"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
