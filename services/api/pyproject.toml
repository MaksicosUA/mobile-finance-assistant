[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-finance-assistant-api"
version = "0.1.0"
description = "Versioned API and authentication for the Mobile Finance Assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "email-validator==2.3.0",
  "fastapi==0.140.0",
  "pydantic==2.13.4",
  "PyJWT==2.13.0",
  "SQLAlchemy[asyncio]==2.0.51",
  "tzdata==2026.3",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobile_finance_api = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"src/mobile_finance_api/main.py" = ["B008"]
# Tests assert by design and use synthetic, non-secret credentials.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only test_*.py is collected, so the *_postgres_e2e.py scripts stay opt-in:
# they need a live database the APK workflow does not provision.
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mobile_finance_api"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
