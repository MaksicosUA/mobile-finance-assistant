name: Checks and on-demand Android APKs

# Every push runs the full quality gate. The Android APK is built only on
# demand, because that build is roughly 7.5 of the 10.5 minutes each run costs,
# and nothing waits on it for ordinary work. Debug APKs
# produced here are also signed with an ephemeral key and cannot be installed
# over a locally built one without clearing the session and encrypted outbox,
# so building one on every push paid for an artifact nobody could use.
#
# Build an APK by running this workflow manually, or by pushing a `v*` tag for
# a delivery.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  FLUTTER_REVISION: 058e0af2c2b57e369d905a03ac9748b0ebf543c6

jobs:
  checks-and-build:
    name: Checks and Android debug builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_APKS: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Java and the Android SDK exist only for the Gradle build, so they are
      # installed only when an APK is actually produced.
      - name: Set up Java
        if: env.BUILD_APKS == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17.0.20+8
          check-latest: false
          verify-signature: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
          pub-cache: false

      - name: Verify Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          actual_revision="$(flutter --version --machine | jq -er '.frameworkRevision')"
          if [[ "$actual_revision" != "$FLUTTER_REVISION" ]]; then
            echo "Unexpected Flutter revision: $actual_revision" >&2
            exit 1
          fi
          flutter config --no-analytics

      - name: Install Android SDK packages
        if: env.BUILD_APKS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not configured." >&2
            exit 1
          fi
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager is not executable at $sdkmanager_bin." >&2
            exit 1
          fi
          "$sdkmanager_bin" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated localization
        shell: bash
        run: |
          set -euo pipefail
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter source
        run: flutter analyze

      # Mandatory gates: a failing test must prevent an installable artifact
      # from being produced at all. See ADR 0015 and ADR 0017.
      - name: Run Flutter tests
        run: flutter test

      # ubuntu-24.04 ships Python 3.12, which is what pyproject requires.
      - name: Run backend tests
        shell: bash
        working-directory: services/api
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --quiet --upgrade pip "uv==0.11.32"
          # The lock the image installs from, so the tests run on what ships.
          .ci-venv/bin/uv lock --check
          requirements="$RUNNER_TEMP/requirements.txt"
          .ci-venv/bin/uv export --frozen --no-emit-project \
            --format requirements-txt --output-file "$requirements"
          .ci-venv/bin/pip install --quiet --no-deps --require-hashes \
            -r "$requirements"
          # Editable: a plain install writes services/api/build/, which the
          # version resolver rejects as an unclean worktree.
          .ci-venv/bin/pip install --quiet --no-deps -e .
          .ci-venv/bin/ruff check .
          .ci-venv/bin/ruff format --check .
          .ci-venv/bin/mypy src
          PYTHONPATH=src .ci-venv/bin/pytest

      # ANDROID_PREVIOUS_REVISION is intentionally empty. The ADR 0013 guard
      # compared a push against `github.event.before`, which only exists for
      # branch pushes; this build now runs on manual dispatch and on tags,
      # where there is no such predecessor. Monotonic delivery versions are
      # therefore enforced by tool/resolve_android_build_version.sh at the
      # point of delivery, not by this workflow. See ADR 0013.
      # Only the fixture APK. The deliverable is a release build signed with
      # the stable key (issue 0005), and that key lives outside every
      # repository — deliberately not in GitHub secrets, where anyone with
      # repository administration could sign as us. CI proves the Android
      # build still compiles; delivery happens where the key is.
      - name: Build and verify the versioned fixture APK
        if: env.BUILD_APKS == 'true'
        id: android_apks
        shell: bash
        env:
          API_BASE_URL: ${{ vars.ANDROID_DEBUG_API_BASE_URL || 'http://127.0.0.1:8000' }}
          HOME_API_TIMEZONE: ${{ vars.HOME_API_TIMEZONE || 'Europe/Berlin' }}
          ANDROID_PREVIOUS_REVISION: ""
        run: |
          tool/build_android_apks.sh --fixture-only \
            --github-output "$GITHUB_OUTPUT"

      # Nothing is uploaded any more. The artifact this workflow used to
      # publish was signed with an ephemeral CI debug key, so it could never
      # update an installed copy — it was undeliverable by construction, and
      # two universal ~160 MiB artifacts per run had already exhausted the
      # Actions storage quota. What remains is the compile check.
      - name: Report the built version
        if: env.BUILD_APKS == 'true'
        shell: bash
        run: cat build/app/outputs/flutter-apk/android-build-version.txt
